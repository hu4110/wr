<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>寫作工作室 · 雲端版</title>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#f5f0e8; --surface:#fffdf7; --border:#d9d0bc;
    --accent:#4a3728; --accent2:#8b6e52; --text:#2c2017; --muted:#9e8f7e;
    --danger:#c0392b; --success:#27ae60; --radius:10px;
    --shadow:0 2px 12px rgba(74,55,40,.10);
    --font-sans:"Noto Sans TC","PingFang TC",sans-serif;
    --font-serif:"Noto Serif TC","Georgia",serif;
  }
  body { font-family:var(--font-sans); background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column; }

  /* Header */
  header { background:var(--accent); color:#f5f0e8; padding:0 24px; height:56px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; box-shadow:0 2px 8px rgba(0,0,0,.25); }
  .logo { font-size:1.1rem; font-weight:700; letter-spacing:.05em; }
  .logo span { opacity:.65; font-weight:400; font-size:.85rem; margin-left:8px; }
  #auth-area { display:flex; align-items:center; gap:12px; }
  #user-info { display:flex; align-items:center; gap:8px; font-size:.85rem; }
  #user-avatar { width:28px; height:28px; border-radius:50%; border:2px solid rgba(255,255,255,.4); }
  .btn { padding:6px 14px; border-radius:6px; border:none; cursor:pointer; font-size:.85rem; font-family:inherit; transition:all .18s; }
  .btn-primary { background:#f5f0e8; color:var(--accent); font-weight:700; }
  .btn-primary:hover { background:#fff; }
  .btn-ghost { background:transparent; color:#f5f0e8; border:1px solid rgba(255,255,255,.4); }
  .btn-ghost:hover { background:rgba(255,255,255,.12); }
  .btn-danger { background:var(--danger); color:#fff; font-weight:600; }
  .btn-danger:hover { filter:brightness(1.1); }
  .btn-sm { padding:4px 10px; font-size:.78rem; }

  /* Sync badge */
  .sync-badge { display:inline-flex; align-items:center; gap:5px; font-size:.75rem; padding:3px 9px; border-radius:20px; }
  .sync-badge.synced { background:rgba(39,174,96,.2); color:#27ae60; }
  .sync-badge.syncing { background:rgba(243,156,18,.18); color:#e67e22; }
  .sync-badge.offline { background:rgba(150,150,150,.18); color:#888; }
  .sync-dot { width:7px; height:7px; border-radius:50%; background:currentColor; }
  .sync-dot.pulse { animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }

  /* Layout */
  .workspace { display:flex; flex:1; height:calc(100vh - 56px); overflow:hidden; }

  /* Sidebar */
  aside { width:240px; min-width:200px; max-width:300px; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
  .sidebar-header { padding:14px 16px 10px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .sidebar-header h3 { font-size:.85rem; font-weight:700; color:var(--muted); letter-spacing:.08em; }
  #btn-new { width:28px; height:28px; border-radius:6px; background:var(--accent); color:#fff; border:none; cursor:pointer; font-size:1.2rem; line-height:1; display:flex; align-items:center; justify-content:center; transition:all .18s; }
  #btn-new:hover { transform:scale(1.1); }
  #notes-list { flex:1; overflow-y:auto; padding:8px; }
  .note-item { padding:10px 12px; border-radius:8px; cursor:pointer; margin-bottom:4px; transition:all .15s; border:2px solid transparent; }
  .note-item:hover { background:var(--bg); }
  .note-item.active { background:var(--bg); border-color:var(--accent2); }
  .note-title { font-size:.88rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .note-meta { font-size:.72rem; color:var(--muted); margin-top:3px; }
  .del-btn { opacity:0; transition:opacity .15s; background:none; border:none; cursor:pointer; color:var(--danger); font-size:1rem; padding:2px 4px; }
  .note-item:hover .del-btn { opacity:1; }

  /* Editor */
  main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
  .toolbar { padding:10px 20px; border-bottom:1px solid var(--border); background:var(--surface); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .toolbar input#note-title-input { flex:1; min-width:160px; border:none; outline:none; font-size:1rem; font-weight:700; font-family:inherit; background:transparent; color:var(--text); }
  .toolbar input#note-title-input::placeholder { color:var(--muted); }
  .divider { width:1px; height:22px; background:var(--border); }
  select.toolbar-select { border:1px solid var(--border); border-radius:6px; padding:4px 8px; font-size:.82rem; font-family:inherit; background:var(--bg); color:var(--text); cursor:pointer; }
  #editor { flex:1; padding:28px 36px; overflow-y:auto; font-size:1rem; line-height:1.9; outline:none; caret-color:var(--accent); background:var(--surface); }
  #editor:empty::before { content:"開始輸入您的筆記..."; color:var(--muted); pointer-events:none; }
  .status-bar { padding:5px 20px; font-size:.75rem; color:var(--muted); background:var(--bg); border-top:1px solid var(--border); display:flex; align-items:center; gap:16px; }

  /* Login screen */
  #login-screen { position:fixed; inset:0; z-index:200; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; }
  .login-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:48px 48px 40px; max-width:380px; width:90%; text-align:center; box-shadow:var(--shadow); }
  .login-icon { font-size:3rem; margin-bottom:12px; }
  .login-card h1 { font-size:1.4rem; color:var(--accent); margin-bottom:8px; }
  .login-card p { font-size:.9rem; color:var(--muted); line-height:1.6; margin-bottom:28px; }
  .btn-google { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:12px 20px; border-radius:8px; border:1.5px solid var(--border); background:var(--surface); font-size:.95rem; font-family:inherit; font-weight:600; cursor:pointer; transition:all .18s; color:var(--text); }
  .btn-google:hover { background:var(--bg); box-shadow:0 2px 8px rgba(0,0,0,.1); }
  .btn-google svg { width:20px; height:20px; }

  /* Config banner */
  #config-banner { background:#fff3cd; border:1px solid #ffc107; border-radius:8px; padding:14px 18px; font-size:.85rem; color:#856404; max-width:520px; width:90%; line-height:1.7; text-align:center; }
  #config-banner code { background:rgba(0,0,0,.07); padding:1px 5px; border-radius:3px; }

  /* Empty state */
  .empty-state { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:var(--muted); font-size:.9rem; }
  .empty-state .icon { font-size:3rem; opacity:.4; }

  @media (max-width:600px) { aside { width:180px; } #editor { padding:18px; } }
</style>
</head>
<body>

<!-- 登入畫面 -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-icon">✍️</div>
    <h1>寫作工作室</h1>
    <p>登入後，您的筆記將自動同步至雲端，<br>在任何裝置上都能繼續創作。</p>
    <button class="btn-google" id="btn-login">
      <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.2l6.8-6.8C35.8 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.9 6.1C12.4 13.1 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.9 7.2l7.6 5.9c4.4-4.1 7.1-10.1 7.1-17.1z"/><path fill="#FBBC05" d="M10.5 28.6A14.6 14.6 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.6-5.9c-2 1.4-4.7 2.2-7.6 2.2-6.2 0-11.5-4.2-13.4-9.8l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>
      使用 Google 帳號登入
    </button>
  </div>
  <div id="config-banner">
    ⚠️ 請先完成設定：將程式碼中的<br>
    <code>SUPABASE_URL</code> 和 <code>SUPABASE_ANON_KEY</code><br>
    替換成你的 Supabase 專案資訊
  </div>
</div>

<!-- 主介面 -->
<header>
  <div class="logo">✍️ 寫作工作室 <span>雲端同步版</span></div>
  <div id="auth-area">
    <div class="sync-badge offline" id="sync-badge">
      <div class="sync-dot"></div><span>未連線</span>
    </div>
    <div id="user-info" style="display:none">
      <img id="user-avatar" src="" alt="avatar">
      <span id="user-name"></span>
    </div>
    <button class="btn btn-ghost btn-sm" id="btn-logout" style="display:none">登出</button>
  </div>
</header>

<div class="workspace">
  <aside>
    <div class="sidebar-header">
      <h3>筆記列表</h3>
      <button id="btn-new" title="新增筆記">＋</button>
    </div>
    <div id="notes-list"></div>
  </aside>
  <main>
    <div class="empty-state" id="empty-state">
      <div class="icon">📝</div>
      <p>選擇一則筆記，或點擊「＋」新增</p>
    </div>
    <div id="editor-panel" style="display:none; flex:1; flex-direction:column; overflow:hidden;">
      <div class="toolbar">
        <input type="text" id="note-title-input" placeholder="筆記標題..." maxlength="60">
        <div class="divider"></div>
        <select class="toolbar-select" id="font-select">
          <option value="var(--font-sans)">黑體</option>
          <option value="var(--font-serif)">宋體</option>
        </select>
        <select class="toolbar-select" id="size-select">
          <option value="0.9rem">小</option>
          <option value="1rem" selected>中</option>
          <option value="1.2rem">大</option>
          <option value="1.5rem">特大</option>
        </select>
        <button class="btn btn-danger btn-sm" id="btn-delete">刪除筆記</button>
      </div>
      <div id="editor" contenteditable="true" spellcheck="false"></div>
      <div class="status-bar">
        <span id="stat-chars">0 字</span>
        <span id="stat-paras">0 段落</span>
        <span id="stat-saved">─</span>
      </div>
    </div>
  </main>
</div>

<script>
// ============================================================
//  ⚠️  請將下方兩個值替換成你的 Supabase 專案資訊
//  前往 https://supabase.com → 你的專案 → Settings → API
// ============================================================
const SUPABASE_URL      = 'https://cxaaydhcrrlwfhpsylfr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_wowWxuYTrvWRlayPcAcbVQ_2peC_l6s';

// ============================================================
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CONFIG_UNFILLED = SUPABASE_URL.includes('YOUR_PROJECT_ID');

const $ = id => document.getElementById(id);

let currentUser    = null;
let currentNoteId  = null;
let saveTimer      = null;
let realtimeChannel = null;
let allNotes       = {};
let isRemoteUpdate = false;

// ── 初始化 ──────────────────────────────────────────────────
async function init() {
  $('config-banner').style.display = 'none';

  // 監聽登入狀態變化
  sb.auth.onAuthStateChange(async (event, session) => {
    if (session?.user) {
      currentUser = session.user;
      await onLogin(session.user);
    } else {
      currentUser = null;
      onLogout();
    }
  });

  // 頁面載入時檢查是否已登入（OAuth 回調後）
  const { data: { session } } = await sb.auth.getSession();
  if (session?.user) {
    currentUser = session.user;
    await onLogin(session.user);
  }

  // 按鈕事件
  $('btn-login').onclick  = googleLogin;
  $('btn-logout').onclick = googleLogout;
  $('btn-new').onclick    = createNote;
  $('btn-delete').onclick = deleteCurrentNote;
  $('editor').addEventListener('input', onEditorInput);
  $('note-title-input').addEventListener('input', onEditorInput);
  $('font-select').addEventListener('change', e => { $('editor').style.fontFamily = e.target.value; });
  $('size-select').addEventListener('change', e => { $('editor').style.fontSize = e.target.value; });
}

// ── Google 登入 ──────────────────────────────────────────────
async function googleLogin() {
  if (CONFIG_UNFILLED) { alert('請先在程式碼中填入你的 Supabase 設定！'); return; }
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.href }
  });
  if (error) alert('登入失敗：' + error.message);
}

async function googleLogout() {
  await sb.auth.signOut();
}

// ── 登入後 ──────────────────────────────────────────────────
async function onLogin(user) {
  $('login-screen').style.display = 'none';
  const meta = user.user_metadata;
  $('user-avatar').src = meta?.avatar_url || '';
  $('user-name').textContent = meta?.full_name || meta?.name || user.email;
  $('user-info').style.display = 'flex';
  $('btn-logout').style.display = '';
  setSyncBadge('synced');
  await loadNotes();
  subscribeRealtime();
}

function onLogout() {
  $('login-screen').style.display = 'flex';
  $('user-info').style.display = 'none';
  $('btn-logout').style.display = 'none';
  setSyncBadge('offline');
  if (realtimeChannel) { sb.removeChannel(realtimeChannel); realtimeChannel = null; }
  allNotes = {}; currentNoteId = null;
  renderNotesList(); showEmptyState();
}

// ── 載入所有筆記 ────────────────────────────────────────────
async function loadNotes() {
  const { data, error } = await sb
    .from('notes')
    .select('*')
    .order('updated_at', { ascending: false });
  if (error) { console.error(error); setSyncBadge('offline'); return; }
  allNotes = {};
  (data || []).forEach(n => { allNotes[n.id] = n; });
  renderNotesList();
}

// ── Realtime 即時同步（其他裝置的更新） ───────────────────
function subscribeRealtime() {
  if (realtimeChannel) sb.removeChannel(realtimeChannel);
  realtimeChannel = sb
    .channel('notes-sync')
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'notes',
        filter: `user_id=eq.${currentUser.id}` },
      payload => {
        const { eventType, new: newRow, old: oldRow } = payload;
        if (eventType === 'DELETE') {
          delete allNotes[oldRow.id];
          if (currentNoteId === oldRow.id) showEmptyState();
        } else {
          allNotes[newRow.id] = newRow;
          // 若目前開啟的筆記在其他裝置被修改，更新畫面
          if (currentNoteId === newRow.id && !saveTimer) {
            isRemoteUpdate = true;
            $('note-title-input').value = newRow.title || '';
            $('editor').innerHTML = newRow.body || '';
            updateStats();
            $('stat-saved').textContent = '已從其他裝置同步 ✓';
            isRemoteUpdate = false;
          }
        }
        renderNotesList();
      }
    )
    .subscribe();
}

// ── 筆記列表渲染 ────────────────────────────────────────────
function renderNotesList() {
  const list = $('notes-list');
  list.innerHTML = '';
  const notes = Object.values(allNotes).sort((a,b) =>
    new Date(b.updated_at) - new Date(a.updated_at));
  if (!notes.length) {
    list.innerHTML = '<div style="padding:16px;font-size:.82rem;color:var(--muted);text-align:center">尚無筆記</div>';
    return;
  }
  notes.forEach(note => {
    const el = document.createElement('div');
    el.className = 'note-item' + (note.id === currentNoteId ? ' active' : '');
    const ts = new Date(note.updated_at);
    const timeStr = ts.toLocaleString('zh-TW', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
    el.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div class="note-title">${escHtml(note.title || '（無標題）')}</div>
        <button class="del-btn" data-id="${note.id}" title="刪除">🗑</button>
      </div>
      <div class="note-meta">${timeStr}</div>`;
    el.addEventListener('click', e => {
      if (e.target.classList.contains('del-btn')) { deleteNote(e.target.dataset.id); return; }
      openNote(note.id);
    });
    list.appendChild(el);
  });
}

// ── 開啟筆記 ────────────────────────────────────────────────
function openNote(id) {
  currentNoteId = id;
  const note = allNotes[id];
  if (!note) return;
  $('empty-state').style.display = 'none';
  const panel = $('editor-panel');
  panel.style.display = 'flex';
  panel.style.flex = '1';
  panel.style.flexDirection = 'column';
  panel.style.overflow = 'hidden';
  $('note-title-input').value = note.title || '';
  $('editor').innerHTML = note.body || '';
  updateStats();
  $('stat-saved').textContent = '已載入 ✓';
  renderNotesList();
}

function showEmptyState() {
  $('empty-state').style.display = 'flex';
  $('editor-panel').style.display = 'none';
  currentNoteId = null;
}

// ── 新增筆記 ────────────────────────────────────────────────
async function createNote() {
  if (!currentUser) return;
  const { data, error } = await sb.from('notes').insert({
    user_id: currentUser.id,
    title: '新筆記',
    body: ''
  }).select().single();
  if (error) { alert('建立失敗：' + error.message); return; }
  allNotes[data.id] = data;
  renderNotesList();
  openNote(data.id);
}

// ── 刪除筆記 ────────────────────────────────────────────────
async function deleteNote(id) {
  if (!confirm('確定要刪除這則筆記嗎？')) return;
  const { error } = await sb.from('notes').delete().eq('id', id);
  if (error) { alert('刪除失敗：' + error.message); return; }
  delete allNotes[id];
  if (currentNoteId === id) showEmptyState();
  renderNotesList();
}

async function deleteCurrentNote() { if (currentNoteId) deleteNote(currentNoteId); }

// ── 編輯器輸入 → Debounce 儲存 ─────────────────────────────
function onEditorInput() {
  if (isRemoteUpdate) return;
  setSyncBadge('syncing');
  $('stat-saved').textContent = '儲存中...';
  updateStats();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveCurrentNote, 1200);
}

async function saveCurrentNote() {
  saveTimer = null;
  if (!currentNoteId || !currentUser) return;
  const title = $('note-title-input').value.trim() || '（無標題）';
  const body  = $('editor').innerHTML;
  const { error } = await sb.from('notes')
    .update({ title, body, updated_at: new Date().toISOString() })
    .eq('id', currentNoteId);
  if (error) {
    setSyncBadge('offline');
    $('stat-saved').textContent = '儲存失敗 ✗';
  } else {
    if (allNotes[currentNoteId]) {
      allNotes[currentNoteId].title = title;
      allNotes[currentNoteId].body  = body;
    }
    setSyncBadge('synced');
    $('stat-saved').textContent = '已儲存至雲端 ✓ ' + new Date().toLocaleTimeString('zh-TW');
    renderNotesList();
  }
}

// ── 統計 ────────────────────────────────────────────────────
function updateStats() {
  const text  = $('editor').innerText || '';
  const chars = text.replace(/\s/g,'').length;
  const paras = text.split(/\n+/).filter(l => l.trim()).length;
  $('stat-chars').textContent = chars + ' 字';
  $('stat-paras').textContent = paras + ' 段落';
}

// ── 同步狀態徽章 ────────────────────────────────────────────
function setSyncBadge(state) {
  const badge = $('sync-badge');
  badge.className = 'sync-badge ' + state;
  badge.querySelector('.sync-dot').className = 'sync-dot' + (state==='syncing'?' pulse':'');
  badge.querySelector('span').textContent = {synced:'已同步',syncing:'同步中',offline:'未連線'}[state];
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

init();
</script>
</body>
</html>
